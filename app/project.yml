name: Outdoor
options:
  bundleIdPrefix: io.outdoor
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Outdoor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Outdoor
        excludes:
          - "Resources/Packs/**/*"
      - path: Outdoor/Resources/Packs
        type: folder        # Copy as a blue "folder reference" so structure survives
        buildPhase: resources
    resources:
      - Outdoor/Resources/Assets.xcassets
    info:
      path: Outdoor/Info.plist
      properties:
        CFBundleDisplayName: Outdoor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AppBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.outdoor.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
