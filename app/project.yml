name: Outdoor
options:
  bundleIdPrefix: io.outdoor
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # MLX-Swift LLM runtime — used by Core/LLM/MLXLLMRunner.swift to run
  # Llama 3.2 3B Instruct (4-bit) on Apple Silicon. The runner code is gated on
  # `canImport(MLXLLM)` so the rest of the app still builds (with MockLLMRunner)
  # if the package fetch fails offline. See docs/llm-model-choice.md.
  MLX:
    url: https://github.com/ml-explore/mlx-swift-examples
    from: "2.21.2"

targets:
  Outdoor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Outdoor
        excludes:
          - "Resources/Packs/**/*"
      - path: Outdoor/Resources/Packs
        type: folder        # Copy as a blue "folder reference" so structure survives
        buildPhase: resources
    dependencies:
      - package: MLX
        product: MLXLLM
      - package: MLX
        product: MLXLMCommon
    resources:
      - Outdoor/Resources/Assets.xcassets
    info:
      path: Outdoor/Info.plist
      properties:
        CFBundleDisplayName: Outdoor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AppBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.outdoor.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

  OutdoorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Outdoor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.outdoor.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Outdoor.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Outdoor"

schemes:
  Outdoor:
    build:
      targets:
        Outdoor: all
        OutdoorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OutdoorTests
