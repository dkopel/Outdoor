# Realistic-user test set for the Camping pack.
#
# Phrasing intentionally varies — short queries, conversational sentences,
# misspellings, slang. The goal is to catch failure modes that a strict
# eval set wouldn't, including:
#  - generic "how do I X" where the wrong section ranks first
#  - synonym mismatches (epi pen vs EpiPen, sticks vs primitive fire)
#  - basic version of a topic missing while advanced version exists
#  - safety routing on dangerous queries
#
# `expected_domain` is the domain the top result should belong to.
# `expected_topics` are keywords/phrases we expect to see in a good answer.
# `expected_intent` (optional) names the safety intent that should fire.
# `notes` flags what we're specifically testing.

# ========================
# FIRE — 12 queries
# ========================

- query: "how do I start a fire"
  expected_domain: fire
  expected_topics: [tinder, kindling, fuel]
  notes: "Basic — should hit a 'how to build a fire' chunk, not 'fire safety'."

- query: "build a campfire"
  expected_domain: fire
  expected_topics: [teepee, lay, tinder]

- query: "fire with no lighter or matches"
  expected_domain: fire
  expected_topics: [ferro, spark, primitive, sticks]
  notes: "Should surface primitive ignition methods if available."

- query: "make fire with sticks"
  expected_domain: fire
  expected_topics: [bow drill, hand drill, friction]
  notes: "User's reported failure case — currently we likely have no content."

- query: "how do I get a fire going in the rain"
  expected_domain: fire
  expected_topics: [wet, fatwood, feather, dry]

- query: "best tinder for a wet day"
  expected_domain: fire
  expected_topics: [birch, fatwood, cotton, vaseline]

- query: "how to use a ferro rod"
  expected_domain: fire
  expected_topics: [spark, striker, scrape]

- query: "is it safe to leave my fire smoldering"
  expected_domain: fire
  expected_topics: [extinguish, water, stir, cold]

- query: "what fire shape for cooking"
  expected_domain: fire
  expected_topics: [log cabin, coals, lay]

- query: "stove won't light help"
  expected_domain: fire
  expected_topics: [stove, canister, jet, fuel]

- query: "signal fire for rescue"
  expected_domain: fire
  expected_topics: [three, triangle, smoke]

- query: "lighting wet wood"
  expected_domain: fire
  expected_topics: [split, feather, dry interior]

