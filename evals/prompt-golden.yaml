# Prompt-golden eval set — 50 questions covering all 12 domains.
#
# Used as Phase 3 regression for the LLM answer quality. Each entry has:
#   query                    : the user's input
#   expected_domains         : list of domains that should appear in retrieved chunks
#   must_include_phrases     : phrases that should appear in the LLM's answer (substring match, case-insensitive)
#   must_not_include_phrases : phrases that must NOT appear (hallucination tripwires)
#   min_citations            : minimum number of valid [chunk_id] citations in the answer
#   notes                    : grading notes for manual review
#
# Grading: an answer "passes" if every must_include phrase appears, no must_not_include
# phrase appears, and at least min_citations valid citations are present. Otherwise fail.
#
# Target: 90%+ pass rate. See docs/prompt-spec.md for the full spec.

# ==================== FIRST AID ====================
- query: "how do I treat a serious cut that won't stop bleeding"
  expected_domains: [first-aid]
  must_include_phrases: ["pressure", "seek"]
  must_not_include_phrases: ["mg", "milligrams", "tourniquet first"]
  min_citations: 1

- query: "what are the signs of hypothermia"
  expected_domains: [first-aid]
  must_include_phrases: ["shiver"]
  must_not_include_phrases: ["mg", "dose"]
  min_citations: 1

- query: "my partner has heat stroke what do I do"
  expected_domains: [first-aid]
  must_include_phrases: ["cool", "911"]
  must_not_include_phrases: ["fine to wait"]
