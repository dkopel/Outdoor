# Camping pack eval set — 25 representative questions across all 12 domains.
# Used to sanity-check retrieval after each rebuild. Manual grading for v1.
#
# expected_domain: the chunk domain that should appear in the top 3 results
# expected_keywords: words/phrases we expect to see in the top result text

- query: "how do I purify water from a stream"
  expected_domain: water
  expected_keywords: [boil, filter, chemical]

- query: "what should I do if I see a bear"
  expected_domain: wildlife
  expected_keywords: [back away, bear spray]

- query: "how to tie a bowline"
  expected_domain: knots
  expected_keywords: [loop, rabbit, standing line]

- query: "help my friend is bleeding badly"
  expected_domain: first-aid
  expected_keywords: [pressure, tourniquet]

- query: "how to start a fire in the rain"
  expected_domain: fire
  expected_keywords: [tinder, fatwood, feather stick]

- query: "i think i'm lost"
  expected_domain: navigation
  expected_keywords: [stop, stay put, signal]

- query: "lightning is close what do i do"
